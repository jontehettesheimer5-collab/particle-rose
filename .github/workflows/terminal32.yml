name: Build Terminal32 IPA
on:
  push:
    branches: [terminal32]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Get pinned iSH source
        run: |
          git clone https://github.com/ish-app/ish.git upstream
          git -C upstream checkout ce96e698f1820b9d8db47e87c501ecb89119d7ce
          git -C upstream submodule update --init --depth 1 deps/libapps deps/libarchive
      - name: Build emulator for package smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld libarchive-dev meson ninja-build
          meson setup upstream/build upstream -Dengine=asbestos
          ninja -C upstream/build
      - name: Check Python, pip, requests and terminal tools
        run: |
          curl -fL --retry 3 https://github.com/ish-app/roots/releases/download/g00712ff0a54b2839c5aa1a8ed758003ca65357dc/appstore-apk.tar.gz -o root.tar.gz
          python3 prepare-root.py root.tar.gz
          upstream/build/tools/fakefsify root.tar.gz runtime
          dns_config=$(cat /etc/resolv.conf)
          timeout 600 upstream/build/ish -f runtime /bin/sh -lc 'printf "%s\n" "$1" > /etc/resolv.conf; setup-dev && . /root/.venv/bin/activate && python -c "import requests; print(requests.__version__)" && pip --version && git --version && curl --version && nano --version && pkg list python3' sh "$dns_config"
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Get pinned iSH source
        run: |
          git clone https://github.com/ish-app/ish.git upstream
          git -C upstream checkout ce96e698f1820b9d8db47e87c501ecb89119d7ce
          git -C upstream submodule update --init --depth 1 deps/libapps deps/libarchive
      - name: Install build dependencies
        run: brew install llvm lld ninja libarchive meson
      - name: Apply Terminal32 additions
        run: python3 prepare.py upstream
      - name: Select stable Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build iPhone and iPad app
        run: |
          cd upstream
          xcodebuild -project iSH.xcodeproj -scheme iSH -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ../build CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            ROOT_BUNDLE_IDENTIFIER=com.thirtytwoe4.terminal32 build > ../build.log 2>&1 || {
              tail -n 180 ../build.log
              exit 1
            }
      - name: Add package setup and package IPA
        run: |
          python3 prepare-root.py build/Build/Products/Release-iphoneos/iSH.app/root.tar.gz
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/iSH.app package/Payload/
          cd package
          zip -qr ../Terminal32-unsigned.ipa Payload
      - name: Archive corresponding source
        run: |
          cp README.md upstream/TERMINAL32.md
          cp -R overlay upstream/terminal32-overlay
          cp prepare.py prepare-root.py upstream/
          git -C upstream diff > Terminal32-changes.patch
          tar --exclude='.git' -czf Terminal32-source.tar.gz upstream
      - name: Build and test chat/file workflow in iOS Simulator
        run: |
          cd upstream
          xcodebuild -project iSH.xcodeproj -scheme iSH -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../sim-build CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            ROOT_BUNDLE_IDENTIFIER=com.thirtytwoe4.terminal32 build > ../sim-build.log 2>&1 || {
              tail -n 180 ../sim-build.log
              exit 1
            }
          cd ..
          python3 prepare-root.py sim-build/Build/Products/Release-iphonesimulator/iSH.app/root.tar.gz
          rm -rf sim-build/Build/Products/Release-iphonesimulator/iSH.app/PlugIns
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,group in devices.items() if "iOS-18" in runtime for d in group if d["isAvailable"] and "iPhone" in d["name"]))')
          xcrun simctl boot "$simulator_id"
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"], timeout=600,check=True)' "$simulator_id"
          xcrun simctl install "$simulator_id" sim-build/Build/Products/Release-iphonesimulator/iSH.app
          xcrun simctl launch "$simulator_id" com.thirtytwoe4.terminal32 --t32-smoke || {
            xcrun simctl spawn "$simulator_id" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "terminal32"' > simulator-launch.log
            xcrun simctl io "$simulator_id" screenshot chat-simulator.png
            exit 1
          }
          simulator_container=$(xcrun simctl get_app_container "$simulator_id" com.thirtytwoe4.terminal32 data)
          for attempt in $(seq 1 100); do
            if [ -f "$simulator_container/Documents/smoke-result.json" ]; then break; fi
            sleep 1
          done
          xcrun simctl io "$simulator_id" screenshot chat-simulator.png
          cp "$simulator_container/Documents/smoke-result.json" smoke-result.json
          python3 -c 'import json; result=json.load(open("smoke-result.json")); print(json.dumps(result, indent=2)); assert result["passed"], "Chat/file regression check failed"'
      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Terminal32-simulator-check
          path: |
            chat-simulator.png
            smoke-result.json
            sim-build.log
            simulator-launch.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Terminal32-unsigned-IPA
          path: Terminal32-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Terminal32-corresponding-source
          path: |
            Terminal32-source.tar.gz
            Terminal32-changes.patch
            build.log
          if-no-files-found: error
