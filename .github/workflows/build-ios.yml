name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for real iPhones
        run: >-
          xcodebuild -project ParticleRose.xcodeproj
          -scheme ParticleRose -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/ParticleRose.app package/Payload/
          cd package
          zip -r ../ParticleRose-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ParticleRose-unsigned-IPA
          path: ParticleRose-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
