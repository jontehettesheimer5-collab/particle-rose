<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    html, body { margin: 0; background: black; width: 100%; height: 100%; overflow: hidden; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <video id="movie" playsinline autoplay preload="auto" src="intro.mp4"></video>
  <script>
    const movie = document.getElementById('movie');
    movie.style.objectFit = window.isIPad ? 'contain' : 'cover';
    movie.play().catch(() => {
      document.body.addEventListener('click', () => movie.play(), { once: true });
    });
  </script>
</body>
</html>
